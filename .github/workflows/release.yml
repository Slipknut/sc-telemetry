name: release

# Tag a version (e.g. `git tag v0.3 && git push --tags`) to build standalone
# Linux + Windows binaries and attach them to the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: sc-telemetry-linux-x86_64
          - os: windows-latest
            asset: sc-telemetry-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build binary
        run: >
          pyinstaller --onefile --name sc-telemetry
          --hidden-import scpaths --hidden-import settings
          --hidden-import gamelog --hidden-import mango
          sc_telemetry.py
      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/sc-telemetry.exe "dist/${{ matrix.asset }}"
          else
            mv dist/sc-telemetry "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
